name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA (V-06): un tag puede moverse a otro commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Generate adapters
        run: python3 tools/secmatrix.py build

      - name: Verify generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Los adaptadores están desincronizados. Ejecuta 'python3 tools/secmatrix.py build' y haz commit."
            exit 1
          fi

      - name: Validate core and adapters
        run: python3 tools/secmatrix.py validate

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Install smoke test
        run: |
          target="$(mktemp -d)"
          python3 tools/secmatrix.py install --target "$target" --no-rules
          test -f "$target/.claude/agents/threat-modeler.md"
          test -f "$target/.codex/agents/threat-modeler.toml"
          test -f "$target/.sec-agent-matrix/core/ethics/ETHICAL_DIRECTIVE.md"
